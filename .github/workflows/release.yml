# Pushing a tag like v0.3.0 builds the app and the installer on Windows and publishes a GitHub release with it.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # the Visual C++ runtime goes into the exe: RYOCS also starts on a PC without the VC++ Redistributable (same as .cargo/config.toml locally)
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5

      # the same checks as on every push: a tag on a commit that never went through them must not be released
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: Repeat logic
        run: node test_sonraki.js

      - name: UI tests (headless Edge)
        run: python tests/ui/calis.py

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: WebView2 bootstrapper
        shell: pwsh
        run: |
          # Microsoft's Evergreen bootstrapper goes into the installer (installs the WebView2 Runtime on PCs that lack it); only a valid Microsoft signature is accepted
          $f = "target\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $f
          $s = Get-AuthenticodeSignature $f
          if ($s.Status -ne "Valid" -or $s.SignerCertificate.Subject -notmatch "O=Microsoft Corporation") { throw "WebView2 bootstrapper signature: $($s.Status) $($s.SignerCertificate.Subject)" }

      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DSurum=$v" kurulum\ryocs.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Get-ChildItem target\kurulum\RYOCS-Setup-*.exe
          # one-click update in the app downloads the installer and checks it against this file
          $s = "target\kurulum\SHA256SUMS"
          [IO.File]::WriteAllText($s, (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name + "`n")
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE) { gh release create "${{ github.ref_name }}" $f.FullName $s --title "RYOCS ${{ github.ref_name }}" --generate-notes }
          else { gh release upload "${{ github.ref_name }}" $f.FullName $s --clobber }
